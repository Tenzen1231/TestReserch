name: Автоматическая заявка PR
run-name: 'PR #${{ github.event.number }} — ${{ github.event.action }} — ${{ github.event.pull_request.head.sha }}'

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
    branches: [feature/team-shared, feature/lab-main]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  submit:
    if: github.event.pull_request.base.ref == 'feature/team-shared' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted dispatcher from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            queue_pr.py
            queue_status.py
            acceptance.py
          sparse-checkout-cone-mode: false

      - name: Submit the exact open PR version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_DISPATCHER_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python queue_pr.py

      - name: Save event trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-dispatch
          path: ${{ runner.temp }}/pr-dispatch.json
          if-no-files-found: error
          retention-days: 30

  # The workflow file of pull_request_target is read from the default branch, so the
  # integration agent's trigger lives here; it only hands over the exact PR version.
  fixbot:
    if: github.event.pull_request.base.ref == 'feature/lab-main' && github.event.action != 'edited' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hand the exact PR version to the integration agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run fixbot.yml --repo "$GITHUB_REPOSITORY" --ref main               -f pr_number="$PR_NUMBER" -f head_ref="$HEAD_REF" -f expected_head="$HEAD_SHA" -f reason=pr_event && exit 0
            sleep $((attempt * 5))
          done
          exit 1
