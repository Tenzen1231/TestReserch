name: Итоговый агент — подметальщик

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows: [Итоговый агент]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  actions: write

concurrency:
  group: fixbot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIXBOT_TARGET: feature/lab-main
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Requeue lost, dead or infrastructure-failed PR versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fixbot.py sweep --state-dir "$RUNNER_TEMP/sweep"
