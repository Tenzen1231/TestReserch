name: Замер параметров RouterAI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: queue-publisher
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-8k, queue-profile-1, queue-profile-2, effort-none-8k, thinking-32k]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated validator image
        run: docker pull python@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2

      - name: Measure one parameter variant
        env:
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: python probe_routerai.py "${{ matrix.variant }}"

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-${{ matrix.variant }}
          path: ${{ runner.temp }}/probe/probe-*.json
          if-no-files-found: warn
          retention-days: 30
