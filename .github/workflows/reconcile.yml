name: Возврат застрявших заявок

on:
  workflow_run:
    workflows: [Очередь изменений]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  actions: write

concurrency:
  group: council-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted reconciler from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            queue_reconcile.py
            queue_pr.py
            queue_status.py
            acceptance.py
          sparse-checkout-cone-mode: false

      - name: Requeue lost, dead or infrastructure-failed versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python queue_reconcile.py

      - name: Save reconciliation trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconcile
          path: ${{ runner.temp }}/reconcile.json
          if-no-files-found: warn
          retention-days: 30
