name: Queue permission boundary probe
run-name: Queue permission boundary probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ordinary_actions_writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Attempt ordinary token publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          target='feature/team-shared'; sha='ea0e4a2e12a52249acea74ac45dcd3ed0dcc8f3c'; expected='6ee946bdc03e9797672592fad4454ce2921f9963'
          env=dict(os.environ)
          auth=base64.b64encode(('x-access-token:'+env['GITHUB_TOKEN']).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          p=subprocess.run(['git','push','origin',sha+':refs/heads/'+target],env=env,capture_output=True,text=True)
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+target],env=env,text=True).split()[0]
          value={'returncode':p.returncode,'stdout':p.stdout,'stderr':p.stderr,'before':expected,'after':current}
          print(json.dumps(value))
          assert p.returncode!=0 and current==expected,value
          assert 'GH013' in p.stderr or 'repository rule' in p.stderr.lower(),value
          PY
  protected_environment_from_working_branch:
    runs-on: ubuntu-latest
    environment: queue-publisher
    steps:
      - name: This step must not execute
        run: echo ENVIRONMENT_BOUNDARY_BROKEN
