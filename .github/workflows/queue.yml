name: Очередь изменений
run-name: 'PR #${{ inputs.pr_number }} — ${{ inputs.source_branch }} — ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Общая ветка назначения (feature/*)'
        required: true
        type: string
        default: feature/team-shared
      source_branch:
        description: 'Ветка участника (feature/*)'
        required: true
        type: string
      requirement:
        description: 'Требование новой правки (принятые требования сохраняются автоматически)'
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - discount
          - fee
          - currency
          - legacy-rubles
          - prefix
          - suffix
          - round-up
          - decimal-separator
          - thousands
          - explicit-sign
          - trim-zeros
          - grouping-pattern
          - negative-parentheses
          - minimum-fraction
          - grouping-threshold
          - zero-text
      pr_number:
        description: 'Номер открытого PR (заполняет автоматический диспетчер)'
        required: true
        type: string
      expected_head:
        description: 'Точная версия PR из события'
        required: true
        type: string
      dispatcher_run_id:
        description: 'Запуск автоматического диспетчера'
        required: true
        type: string
      event_action:
        description: 'Событие PR'
        required: true
        type: string
      hold_seconds:
        description: 'Pause before publication for controlled concurrency tests (0..90)'
        required: true
        type: number
        default: 0

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: council-ci-gate-${{ inputs.base_branch }}
  queue: max
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: queue-publisher
    timeout-minutes: 15
    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      HOLD_SECONDS: ${{ inputs.hold_seconds }}
      REQUIREMENT: ${{ inputs.requirement }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      DISPATCHER_RUN_ID: ${{ inputs.dispatcher_run_id }}
      PR_EVENT_ACTION: ${{ inputs.event_action }}
      QUEUE_AUTO_REPAIR: 'true'
      QUEUE_STRUCTURAL_REPAIR: 'true'
      QUEUE_SSH_PUBLISH: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted gate and oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize gate state
        run: echo "STATE_DIR=$RUNNER_TEMP/council-ci-gate" >> "$GITHUB_ENV"

      - name: Prepare isolated validator image
        run: docker pull python@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2

      - name: Install verified Mergiraf 0.20.0
        run: |
          mkdir -p "$RUNNER_TEMP/mergiraf"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://codeberg.org/mergiraf/mergiraf/releases/download/v0.20.0/mergiraf_x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/mergiraf/archive.tar.gz"
          printf '%s  %s\n' fc77469be936b02ab9021b984a3aebc9250a21ae3d264f2ef2198eb8b31b2a7b "$RUNNER_TEMP/mergiraf/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mergiraf/archive.tar.gz" -C "$RUNNER_TEMP/mergiraf"
          binary=$(find "$RUNNER_TEMP/mergiraf" -type f -name mergiraf)
          printf '%s  %s\n' 47b64ee837b110acd48a633c0bd13ff09e6a794b9739f896362464e64f7c7217 "$binary" | sha256sum --check --strict
          echo "MERGIRAF_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Initialize protected publisher and budget identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_DEPLOY_KEY: ${{ secrets.QUEUE_DEPLOY_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          from queue_status import NoRedirect
          request = urllib.request.Request('https://api.github.com/meta', headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              keys = json.load(response)['ssh_keys']
          if not keys or any('\n' in key or '\r' in key for key in keys):
              raise SystemExit('GitHub did not return valid SSH host keys')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'github_known_hosts').write_text(
              ''.join('github.com ' + key + '\n' for key in keys), encoding='utf-8')
          PY
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$QUEUE_DEPLOY_KEY" | ssh-add - >/dev/null
          unset QUEUE_DEPLOY_KEY
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/github_known_hosts" >> "$GITHUB_ENV"

      - name: Prepare and validate candidate
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: >-
          python queue_gate.py prepare
          --repo "$GITHUB_WORKSPACE" --state-dir "$STATE_DIR"
          --base-branch "$BASE_BRANCH" --source-branch "$SOURCE_BRANCH"
          --hold-seconds "$HOLD_SECONDS"
          --requirement "$REQUIREMENT"

      - name: Hold for concurrent changes
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          state = json.loads((pathlib.Path(os.environ['STATE_DIR']) / 'state.json').read_text())
          seconds = state['hold_seconds']
          print(f'Holding {seconds} seconds before re-observing source and target.', flush=True)
          time.sleep(seconds)
          PY

      - name: Revalidate and publish exact candidate
        if: steps.prepare.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: |
          python queue_gate.py publish --repo "$GITHUB_WORKSPACE" --state-dir "$STATE_DIR"

      - name: Close publisher identity
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null; fi

      - name: Finish pending source status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python queue_gate.py finalize --repo "$GITHUB_WORKSPACE" --state-dir "$STATE_DIR"

      - name: Summarize decision
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['STATE_DIR']) / 'result.json'
          if not path.exists():
              raise SystemExit('Gate did not produce result.json; inspect preceding setup errors.')
          result = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('## ' + result.get('decision_label', 'Ошибка запуска') + '\n\n')
              stream.write(result.get('description', result['reason']) + '\n\n')
              for key in ('reason', 'source_branch', 'base_branch', 'source', 'base', 'candidate', 'tree',
                          'published_candidate', 'observed_remote_head', 'validator_sha256'):
                  if key in result:
                      stream.write(f'- {key}: `{result[key]}`\n')
              stream.write(f"- Попыток проверки: {len(result['attempts'])}\n")
              accounting = result.get('repair_accounting') or {}
              stream.write(f"- Резервов ремонта ИИ: {len(result.get('repairs', []))}/2\n")
              stream.write(f"- Запросов к модели отправлено: {accounting.get('request_sent', 0)}, "
                           f"ответов получено: {accounting.get('response_received', 0)}, "
                           f"патчей предложено: {accounting.get('proposed', 0)}, "
                           f"проверено: {accounting.get('validated', 0)}, "
                           f"опубликовано: {accounting.get('published', 0)}\n")
              stream.write(f"- Проверок Mergiraf: {len(result.get('structural_repairs', []))}\n")
              if result.get('dispatcher_run_id'):
                  stream.write(f"- Автоматическое событие: {result['event_action']}, PR #{result['pr_number']}, диспетчер {result['dispatcher_run_id']}\n")
              if result.get('needs_human'):
                  stream.write('\n**Нужен человек:** согласуйте спорное поведение и одного автора итоговой правки. '
                               'Автоматических повторов больше не будет.\n')
              stream.write('\nСтатус участника относится к указанному source SHA и целевой ветке. '
                           'Отклонение или ошибка делают запуск красным; доказательства сохраняются всегда. '
                           'Информационный статус не заменяет серверные ограничения публикации.\n')
          PY

      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queue-evidence
          path: |
            ${{ runner.temp }}/council-ci-gate/result.json
            ${{ runner.temp }}/council-ci-gate/gate.log
          if-no-files-found: error
          retention-days: 30
